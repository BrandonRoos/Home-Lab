<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif">

  <defs>
    <style>
      .tier   { font-size: 10px; fill: #94a3b8; font-weight: 700; letter-spacing: 1.2px; }
      .vm     { font-size: 14px; fill: #0f172a; font-weight: 650; }
      .role   { font-size: 10px; fill: #64748b; }
      .meta   { font-size: 9px;  fill: #94a3b8; }
      .ram    { font-size: 10px; fill: #2563eb; font-weight: 700; }
      .flow   { font-size: 10px; fill: #475569; font-weight: 600; }
      .wire   { stroke: #cbd5e1; stroke-width: 2; fill: none; stroke-linecap: round; }
      .attack { stroke: #dc2626; stroke-width: 2; fill: none; stroke-linecap: round; }
      .tele   { stroke: #2563eb; stroke-width: 2; fill: none; stroke-linecap: round; }
      .ai     { stroke: #7c3aed; stroke-width: 2; fill: none; stroke-dasharray: 5 4; stroke-linecap: round; }
      .card   { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .redlab { font-size: 10px; fill: #dc2626; font-weight: 600; }
      .blulab { font-size: 10px; fill: #2563eb; font-weight: 600; }
      .ailab  { font-size: 10px; fill: #7c3aed; font-weight: 600; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L7,3.2 z" fill="#dc2626"/>
    </marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L7,3.2 z" fill="#2563eb"/>
    </marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L7,3.2 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#ffffff"/>

  <!-- header -->
  <text x="40" y="44" font-size="20" font-weight="700" fill="#0f172a">SOC Detection Lab</text>
  <text x="40" y="64" font-size="12" fill="#64748b">Proxmox VE · Lenovo ThinkCentre M710q · 32GB</text>
  <line x1="40" y1="82" x2="960" y2="82" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ═══════════ HYPERVISOR SHELL ═══════════ -->
  <rect x="40" y="106" width="920" height="470" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="40" y="106" width="920" height="34" rx="14" fill="#e2e8f0"/>
  <rect x="40" y="126" width="920" height="14" fill="#e2e8f0"/>
  <text x="62" y="128" font-size="11" font-weight="700" fill="#475569">PROXMOX VE — HYPERVISOR</text>
  <text x="820" y="128" font-size="10" fill="#64748b">KSM enabled</text>

  <!-- ═══════════ ATTACK PLANE ═══════════ -->
  <text x="62" y="172" class="tier">ATTACK</text>

  <!-- Kali -->
  <rect x="70" y="190" width="200" height="120" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="90" y="220" class="vm">Kali Linux</text>
  <text x="90" y="238" class="role">Attacker box</text>
  <line x1="90" y1="250" x2="250" y2="250" stroke="#fecaca" stroke-width="1"/>
  <text x="90" y="268" class="meta">Nmap · enumeration</text>
  <text x="90" y="282" class="meta">OWASP ZAP · offensive tooling</text>
  <text x="90" y="300" class="ram">4GB · dynamic</text>

  <!-- Victim -->
  <rect x="70" y="336" width="200" height="130" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="90" y="366" class="vm">Victim VM</text>
  <text x="90" y="384" class="role">Disposable target</text>
  <line x1="90" y1="396" x2="250" y2="396" stroke="#fde68a" stroke-width="1"/>
  <text x="90" y="414" class="meta">Atomic Red Team runs here</text>
  <text x="90" y="428" class="meta">Snapshot → revert after tests</text>
  <text x="90" y="442" class="meta">Wazuh agent installed</text>
  <text x="90" y="460" class="ram">1–4GB · dynamic</text>

  <!-- Kali attacks Victim -->
  <path class="attack" d="M 170 310 L 170 336" marker-end="url(#ar)"/>

  <!-- ═══════════ DETECTION PLANE ═══════════ -->
  <text x="420" y="172" class="tier">DETECTION</text>

  <rect x="380" y="190" width="240" height="276" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="404" y="220" class="vm">Wazuh</text>
  <text x="404" y="238" class="role">SIEM · all-in-one</text>
  <line x1="404" y1="250" x2="596" y2="250" stroke="#bfdbfe" stroke-width="1"/>

  <rect x="404" y="264" width="192" height="34" rx="6" class="card"/>
  <text x="418" y="285" font-size="11" fill="#0f172a" font-weight="600">Manager</text>
  <text x="560" y="285" class="meta" text-anchor="end">agent events</text>

  <rect x="404" y="306" width="192" height="34" rx="6" class="card"/>
  <text x="418" y="327" font-size="11" fill="#0f172a" font-weight="600">Indexer</text>
  <text x="560" y="327" class="meta" text-anchor="end">OpenSearch</text>

  <rect x="404" y="348" width="192" height="34" rx="6" class="card"/>
  <text x="418" y="369" font-size="11" fill="#0f172a" font-weight="600">Dashboard</text>
  <text x="560" y="369" class="meta" text-anchor="end">HTTPS</text>

  <line x1="404" y1="398" x2="596" y2="398" stroke="#bfdbfe" stroke-width="1"/>
  <text x="404" y="418" class="meta">Ports 1514 · 1515 · 443</text>
  <text x="404" y="434" class="meta">Custom rules ← Sigma</text>
  <text x="404" y="458" class="ram">8–12GB · FIXED (JVM heap)</text>

  <!-- Victim -> Wazuh telemetry -->
  <path class="tele" d="M 270 400 L 324 400 L 324 300 L 380 300" marker-end="url(#ab)"/>
  <text x="288" y="392" class="blulab">telemetry</text>

  <!-- ═══════════ ANALYSIS PLANE ═══════════ -->
  <text x="768" y="172" class="tier">ANALYSIS</text>

  <rect x="730" y="190" width="200" height="180" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="750" y="220" class="vm">Ollama</text>
  <text x="750" y="238" class="role">Local LLM · on-prem</text>
  <line x1="750" y1="250" x2="910" y2="250" stroke="#e9d5ff" stroke-width="1"/>
  <text x="750" y="268" class="meta">Alert enrichment</text>
  <text x="750" y="282" class="meta">Log summarization</text>
  <text x="750" y="300" class="meta">Quantized model, CPU inference</text>
  <text x="750" y="322" font-size="9" fill="#7c3aed" font-weight="600">Data never leaves the network</text>
  <text x="750" y="352" class="ram">4–12GB · dynamic</text>

  <!-- Wazuh -> Ollama -->
  <path class="ai" d="M 620 280 L 730 280" marker-end="url(#ap)"/>
  <text x="675" y="272" class="ailab" text-anchor="middle">ambiguous</text>
  <text x="675" y="298" class="meta" text-anchor="middle">alerts only</text>

  <!-- deterministic filter note -->
  <rect x="730" y="392" width="200" height="74" rx="10" class="card"/>
  <text x="750" y="416" font-size="11" font-weight="650" fill="#0f172a">Deterministic first</text>
  <text x="750" y="434" class="meta">ATT&amp;CK signature + IOC match</text>
  <text x="750" y="448" class="meta">runs BEFORE the model.</text>
  <text x="750" y="462" class="meta">Rules handle the known cases.</text>

  <path class="ai" d="M 830 370 L 830 392"/>

  <!-- ═══════════ RAM BUDGET BAR ═══════════ -->
  <text x="40" y="622" class="tier">MEMORY BUDGET — 32GB</text>

  <rect x="40" y="636" width="920" height="30" rx="6" fill="#f1f5f9"/>
  <rect x="40" y="636" width="345" height="30" rx="6" fill="#2563eb"/>
  <rect x="385" y="636" width="345" height="30" fill="#7c3aed"/>
  <rect x="730" y="636" width="115" height="30" fill="#f59e0b"/>
  <rect x="845" y="636" width="115" height="30" rx="6" fill="#94a3b8"/>

  <text x="212" y="656" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Wazuh · 8–12GB (fixed)</text>
  <text x="557" y="656" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Ollama · 4–12GB</text>
  <text x="787" y="656" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Victim</text>
  <text x="902" y="656" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Kali</text>

  <text x="40" y="690" class="meta">Ballooning lets idle VMs release RAM to whichever workload needs it. Wazuh stays fixed — the OpenSearch JVM pre-allocates its heap at startup.</text>

  <!-- ═══════════ LEGEND ═══════════ -->
  <g transform="translate(620, 592)">
    <line x1="0" y1="0" x2="22" y2="0" class="attack"/>
    <text x="30" y="4" class="meta">attack</text>
    <line x1="90" y1="0" x2="112" y2="0" class="tele"/>
    <text x="120" y="4" class="meta">telemetry</text>
    <line x1="196" y1="0" x2="218" y2="0" class="ai"/>
    <text x="226" y="4" class="meta">AI analysis</text>
  </g>

</svg>
